[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-harness"
version = "0.1.1"
description = "Engine-agnostic paired-view capture integrity harness"
requires-python = ">=3.12"
dependencies = ["numpy", "pyarrow", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]
